<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="Description" content="AEM Sidekick Library" />
    <meta name="robots" content="noindex" />
    <base href="/" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #ededed;
        height: 100%;
      }

      helix-sidekick { display: none }

      /* Custom table header colors */
      :root {
        --sk-block-table-background-color: #1e293b;
        --sk-block-table-foreground-color: #ffffff;
        --sk-section-metadata-table-background-color: #374151;
        --sk-section-metadata-table-foreground-color: #ffffff;
        --sk-metadata-table-background-color: #4b5563;
        --sk-metadata-table-foreground-color: #ffffff;
      }
    </style>
    <title>Sidekick Library</title>
  </head>

  <body>
    <script
      type="module"
      src="https://www.aem.live/tools/sidekick/library/index.js"
    ></script>
    <script>
      const library = document.createElement('sidekick-library');
      library.config = {
        base: '/tools/sidekick/library.json',
        plugins: {
          blocks: {
            viewPorts: [
              { width: 375, label: 'Mobile', icon: 'phone' },
              { width: 768, label: 'Tablet', icon: 'tablet' },
              { width: 1200, label: 'Desktop', icon: 'desktop' }
            ],
            contentEditable: true
          }
        }
      };

      document.body.prepend(library);
    </script>
  </body>
</html>
